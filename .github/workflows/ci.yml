name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium
          coverage: none

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # TEMPORARY until invoiceshelf/modules 3.5.0 is tagged: install the SDK's
      # integration/3.5 preview branch, then restore composer.json so the package
      # checks below still see the real ^3.5 requirement. Replace this step with
      # `composer install --no-interaction --prefer-dist` once the tag exists.
      - name: Install PHP dependencies (SDK 3.5 preview)
        run: |
          composer require --no-interaction --no-update 'invoiceshelf/modules:dev-integration/3.5 as 3.5.0'
          composer update --no-interaction --prefer-dist
          git checkout -- composer.json

      - name: Build the bundle from bundle.lock
        # Against the host's 3.x branch: a bundle that no longer fits the next
        # host release fails here before it fails a release.
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/InvoiceShelf/InvoiceShelf/3.x/composer.lock \
            --output "$RUNNER_TEMP/host-composer.lock"
          vendor/bin/invoiceshelf-module bundle . --host-lock="$RUNNER_TEMP/host-composer.lock"

      - name: Verify PHP and package contracts
        run: |
          composer run lint
          composer run test
          vendor/bin/invoiceshelf-module validate-module module.json
          vendor/bin/invoiceshelf-module validate-package .

      - name: Verify frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm exec tsc --noEmit
          pnpm run build
          git diff --exit-code -- dist
